# This workflow automatically merges Dependabot PRs into the CBF WordPress application

name: PR Auto Merge

# Controls when the action will run. Triggers the workflow on pull request events
on:
  pull_request:
    branches: [develop]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  merge:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN  }}
      - uses: ahmadnassri/action-dependabot-auto-merge@45fc124d949b19b6b8bf6645b6c9d55f4f9ac61a # v2.6.6
        with:
          target: patch
          github-token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
