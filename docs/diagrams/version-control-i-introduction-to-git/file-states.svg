<svg viewBox="0 0 420 372" width="420" height="372" class="cbf-diagram" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="statesTitle statesDesc">
  <style>
    /* CBF Academy visual identity: the design tokens in the academy theme's
       assets/css/content.css (ink, outline, tint, yellow, Atkinson Hyperlegible). */
    .cbf-diagram-canvas { fill: #fff; }
    .cbf-diagram-zone { fill: rgba(17, 24, 28, 0.05); }
    .cbf-diagram-node { fill: #fff; stroke: rgba(17, 24, 28, 0.25); stroke-width: 1.5; }
    .cbf-diagram-node-key { fill: #ffda65; }
    .cbf-diagram-heading { font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #11181c; }
    .cbf-diagram-label { font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif; font-size: 15px; fill: #11181c; }
    .cbf-diagram-code { font-family: "Atkinson Hyperlegible Mono", ui-monospace, monospace; font-size: 14px; fill: #11181c; }
    .cbf-diagram-lane { stroke: rgba(17, 24, 28, 0.25); stroke-width: 1.5; }
    .cbf-diagram-flow { fill: none; stroke: #11181c; stroke-width: 2; }
    .cbf-diagram-arrow { fill: #11181c; }
    .cbf-diagram-point { fill: #11181c; }
  </style>
  <title id="statesTitle">How a file moves between the four states as you work</title>
  <desc id="statesDesc">Adding a new file takes it from untracked to unmodified. Editing it makes it modified, and staging it makes it staged. Committing returns it to unmodified. Removing the file makes it untracked again.</desc>
  <rect class="cbf-diagram-canvas" width="420" height="372"/>
  <defs>
    <marker id="statesArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="cbf-diagram-arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="cbf-diagram-zone" x="6" y="6" width="408" height="360" rx="8"/>
  <text class="cbf-diagram-heading" x="18" y="30">Your working directory</text>
  <line class="cbf-diagram-lane" x1="60" y1="94" x2="60" y2="354"/>
  <rect class="cbf-diagram-node" x="14" y="48" width="92" height="46" rx="8"/>
  <text class="cbf-diagram-label" x="60" y="76" text-anchor="middle">Untracked</text>
  <line class="cbf-diagram-lane" x1="160" y1="94" x2="160" y2="354"/>
  <rect class="cbf-diagram-node" x="114" y="48" width="92" height="46" rx="8"/>
  <text class="cbf-diagram-label" x="160" y="76" text-anchor="middle">Unmodified</text>
  <line class="cbf-diagram-lane" x1="260" y1="94" x2="260" y2="354"/>
  <rect class="cbf-diagram-node" x="214" y="48" width="92" height="46" rx="8"/>
  <text class="cbf-diagram-label" x="260" y="76" text-anchor="middle">Modified</text>
  <line class="cbf-diagram-lane" x1="360" y1="94" x2="360" y2="354"/>
  <rect class="cbf-diagram-node" x="314" y="48" width="92" height="46" rx="8"/>
  <text class="cbf-diagram-label" x="360" y="76" text-anchor="middle">Staged</text>
  <line class="cbf-diagram-flow" x1="60" y1="140" x2="160" y2="140" marker-end="url(#statesArrow)"/>
  <text class="cbf-diagram-label" x="110" y="131" text-anchor="middle">Add</text>
  <line class="cbf-diagram-flow" x1="160" y1="192" x2="260" y2="192" marker-end="url(#statesArrow)"/>
  <text class="cbf-diagram-label" x="210" y="183" text-anchor="middle">Edit</text>
  <line class="cbf-diagram-flow" x1="260" y1="244" x2="360" y2="244" marker-end="url(#statesArrow)"/>
  <text class="cbf-diagram-label" x="310" y="235" text-anchor="middle">Stage</text>
  <line class="cbf-diagram-flow" x1="360" y1="296" x2="160" y2="296" marker-end="url(#statesArrow)"/>
  <text class="cbf-diagram-label" x="260" y="287" text-anchor="middle">Commit</text>
  <line class="cbf-diagram-flow" x1="160" y1="346" x2="60" y2="346" marker-end="url(#statesArrow)"/>
  <text class="cbf-diagram-label" x="110" y="337" text-anchor="middle">Remove</text>
</svg>
